# Aleph Surg full-dataset preprocessing for WRIST_LEFT.
# Run from repo root after generating the local train/eval RBM datasets.
train_datasets:
  - "./robometer_dataset/aleph_surg/wrist_left/train/aleph_surg_wrist_left_train"

train_subsets:
  - ["train"]

eval_datasets:
  - "./robometer_dataset/aleph_surg/wrist_left/eval/aleph_surg_wrist_left_eval"

eval_subsets:
  - ["eval"]

max_frames_for_preprocessing: 32
video_frame_sampling: "uniform"
num_proc: 1
num_threads: 4
force_reprocess: false
cache_dir: /path/to/robometer/processed_datasets

precompute_embeddings: false
embeddings_cache_dir: "embeddings"
dinov2_model: "facebook/dinov2-base"
sentence_model: "sentence-transformers/all-MiniLM-L12-v2"
embedding_batch_size: 64
